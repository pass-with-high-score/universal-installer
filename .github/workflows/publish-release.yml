name: Deploy

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Version Name
        run: echo "VERSION_NAME=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
            ~/.gradle/daemon
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Signing
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > universal-installer-release.jks

      - name: Create key.properties
        run: |
          cat > key.properties <<EOF
          storeFile=universal-installer-release.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Decode Play Store key
        run: echo "${{ secrets.PLAY_STORE_CONFIG_JSON }}" | base64 --decode > fastlane/play-store-key.json

      # Enables the `play` flavor and TV Firebase integration. Without this file :app has no play variants at all and every
      # bundlePlayRelease below fails with "task not found" — see docs/FIREBASE.md.
      - name: Decode Firebase config
        run: |
          mkdir -p app/src/play tv/src/play
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/src/play/google-services.json
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > tv/src/play/google-services.json

      # Build & Deploy
      - name: Grant execute permission
        run: chmod +x gradlew

      # Ships the phone, watch and TV AABs in one release — they share a package name, so Play
      # treats them as three form factors of the same listing.
      - name: Deploy to production track
        id: play_store_production
        continue-on-error: true
        run: bundle exec fastlane production

      # Deleting google-services.json below removes the `play` variant from the build entirely,
      # so the bundle it produced is copied out of build/ first rather than trusting that
      # directory to survive a reconfigure. The lane above is continue-on-error, so a missing
      # bundle must not fail the job either — the release still ships its APKs without it.
      - name: Keep the store bundle for the release
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/ || \
            echo "::warning::no play bundle to attach to the release"
          cp tv/build/outputs/bundle/playRelease/tv-play-release.aab dist/ || \
            echo "::warning::no TV play bundle to attach to the release"

      # F-Droid rebuilds the opensource APK from a plain checkout and requires it to match the
      # one published here byte for byte. A checkout has no google-services.json, so leaving
      # ours in place makes that impossible: the Crashlytics plugin applies project-wide and
      # injects mapping_file_id and version_control_info into *every* variant, opensource
      # included. Two extra string resources shift every resource ID, which moves resources.arsc,
      # the binary manifest, all of res/, and classes.dex through inlined R constants.
      # Play already has its AAB from the fastlane lanes above, so the file has done its job.
      - name: Drop the Firebase config before building the open-source artifacts
        run: |
          rm -f app/src/play/google-services.json
          rm -f tv/src/play/google-services.json

      # The APK published here is the `opensource` flavor: same app, minus Firebase Analytics and
      # Crashlytics. That is the build F-Droid reproduces and the one people sideload.
      #
      # The AAB attached to the release is the `play` one the fastlane lanes already built, so the
      # release carries a copy of exactly what went to the store. An AAB cannot be sideloaded, so
      # the flavor difference costs installers nothing — but it does mean the release page hosts a
      # bundle containing Analytics and Crashlytics.
      - name: Build release APK & AAB
        run: ./gradlew :app:assembleOpensourceRelease :tv:assembleOpensourceRelease :wearos:assembleRelease :wearos:bundleRelease

      # The flavor dimension renamed this to app-opensource-release.apk, but two downstream
      # consumers key off the old name: F-Droid's recipe pins `binary:` to app-release.apk for
      # its reproducible-build check, and IzzyOnDroid picks its APK out of the release by name
      # (the release also carries tv-release.apk). Rename back rather than break both.
      - name: Restore the published artifact name
        run: |
          mv app/build/outputs/apk/opensource/release/app-opensource-release.apk \
             app/build/outputs/apk/opensource/release/app-release.apk
          mv tv/build/outputs/apk/opensource/release/tv-opensource-release.apk \
             tv/build/outputs/apk/opensource/release/tv-release.apk

      # Artifacts
      - name: Upload release AAB & APK
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            dist/app-play-release.aab
            app/build/outputs/apk/opensource/release/app-release.apk
            dist/tv-play-release.aab
            tv/build/outputs/apk/opensource/release/tv-release.apk
            wearos/build/outputs/bundle/release/wearos-release.aab
            wearos/build/outputs/apk/release/wearos-release.apk
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/opensource/release/app-release.apk
            dist/app-play-release.aab
            tv/build/outputs/apk/opensource/release/tv-release.apk
            dist/tv-play-release.aab
            wearos/build/outputs/apk/release/wearos-release.apk
            wearos/build/outputs/bundle/release/wearos-release.aab
          token: ${{ secrets.GITHUB_TOKEN }}
